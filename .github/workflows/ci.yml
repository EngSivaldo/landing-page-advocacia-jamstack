name: CI/CD Pipeline - Security & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar se arquivo de teste existe antes de rodar
        run: |
          if [ -f "tests/security-compliance.test.js" ]; then
            node tests/security-compliance.test.js
          else
            echo "Aviso: Teste não encontrado no caminho indicado, pulando etapa."
          fi

  deploy-github-pages:
    needs: test-and-validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy para o GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages